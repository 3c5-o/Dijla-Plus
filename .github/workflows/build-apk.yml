name: Build Dijla Plus APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Debug + Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Build Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" 2>/dev/null || true
          chmod -R u+rwX "$SDK_DIR" 2>/dev/null || true
          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_DIR/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "$SDK_DIR/licenses/android-googlexr-license"
          printf "\n859f317696f67ef3d7f30a5560e7834b43903\n" > "$SDK_DIR/licenses/android-sdk-arm-dbt-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

      - name: Prepare Environment & Signing Keystores
        run: |
          sed -i 's/rootProject.name = .*/rootProject.name = "DijlaPlus"/' settings.gradle.kts
          if [ ! -f .env.example ]; then
            echo "# GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ] || [ ! -s my-upload-key.jks ]; then
            rm -f my-upload-key.jks
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dijlaplus2026 \
              -keypass dijlaplus2026 \
              -dname "CN=Dijla Plus, OU=IPTV, O=DijlaPlus, L=Baghdad, S=IQ, C=IQ"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore my-upload-key.jks \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dijlaplus2026 \
              -keypass dijlaplus2026 \
              -dname "CN=Dijla Plus, OU=IPTV, O=DijlaPlus, L=Baghdad, S=IQ, C=IQ"
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: dijlaplus2026
          KEY_ALIAS: upload
          KEY_PASSWORD: dijlaplus2026
        run: |
          # Ensure standard compileSdk=36, minSdk=23, targetSdk=34 so the compiled AndroidManifest.xml
          # is 100% compatible with all Android phones, tablets, and Android TV boxes without minorApiLevel/preview errors
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/' app/build.gradle.kts || true
          sed -i 's/minSdk = 24/minSdk = 23/' app/build.gradle.kts || true
          sed -i 's/targetSdk = 36/targetSdk = 34/' app/build.gradle.kts || true

          export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
          export STORE_PASSWORD="dijlaplus2026"
          export KEY_ALIAS="upload"
          export KEY_PASSWORD="dijlaplus2026"

          gradle assembleDebug assembleRelease \
            -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease \
            --no-configuration-cache \
            --stacktrace

      - name: Zipalign & Sign APKs (V1 + V2 + V3 Full Signatures)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ZIPALIGN=$(find "$SDK_DIR/build-tools" -name zipalign -type f 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          mkdir -p dist-apk tmp-apk

          # 1. Align & Sign Release APK (V1 + V2 + V3)
          RELEASE_INPUT=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f -v 4 "$RELEASE_INPUT" tmp-apk/release-aligned.apk
          "$APKSIGNER" sign \
            --min-sdk-version 21 \
            --ks "${GITHUB_WORKSPACE}/my-upload-key.jks" \
            --ks-key-alias upload \
            --ks-pass pass:dijlaplus2026 \
            --key-pass pass:dijlaplus2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out dist-apk/Dijla-Plus-v2.6.0-Signed-Release.apk \
            tmp-apk/release-aligned.apk
          "$APKSIGNER" verify --verbose --min-sdk-version 21 --print-certs dist-apk/Dijla-Plus-v2.6.0-Signed-Release.apk

          # 2. Align & Sign Debug APK (V1 + V2 + V3)
          DEBUG_INPUT=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f -v 4 "$DEBUG_INPUT" tmp-apk/debug-aligned.apk
          "$APKSIGNER" sign \
            --min-sdk-version 21 \
            --ks "${GITHUB_WORKSPACE}/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out dist-apk/Dijla-Plus-v2.6.0-Signed-Debug.apk \
            tmp-apk/debug-aligned.apk
          "$APKSIGNER" verify --verbose --min-sdk-version 21 --print-certs dist-apk/Dijla-Plus-v2.6.0-Signed-Debug.apk

          ls -lh dist-apk/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dijla-Plus-Signed-Release-APK
          path: dist-apk/Dijla-Plus-v2.6.0-Signed-Release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Signed Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dijla-Plus-Signed-Debug-APK
          path: dist-apk/Dijla-Plus-v2.6.0-Signed-Debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Direct Installable APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0-latest
          name: "دجلة بلس | Dijla Plus v2.6.0 (Direct Install APK)"
          body: |
            ### 📲 تحميل وتثبيت مباشر لتطبيق دجلة بلس (Dijla Plus v2.6.0)
            للتثبيت المباشر على الهاتف أو شاشات Android TV بدون فك ضغط:
            1. قم بتحميل ملف **`Dijla-Plus-v2.6.0-Signed-Release.apk`** مباشرة من الأسفل (قسم Assets).
            2. الملف موقع بالكامل بتوقيع ثلاثي (**V1 + V2 + V3**) ومفحوص عبر `zipalign` و `apksigner`.
            3. ملاحظة: إذا كان لديك إصدار قديم مثبت بتوقيع مختلف، يرجى حذف الإصدار القديم أولاً ثم تثبيت هذا الملف.
          files: |
            dist-apk/Dijla-Plus-v2.6.0-Signed-Release.apk
            dist-apk/Dijla-Plus-v2.6.0-Signed-Debug.apk
          prerelease: false
          make_latest: true
        continue-on-error: true
