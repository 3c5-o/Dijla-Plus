name: Build Dijla Plus APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36.1 & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Prepare Environment & Keystores
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dijlaplus2026 \
              -keypass dijlaplus2026 \
              -dname "CN=Dijla Plus, OU=IPTV, O=DijlaPlus, L=Baghdad, S=IQ, C=IQ"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'dijlaplus2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dijlaplus2026' }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename and Collect APK Files
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/Dijla-Plus-v2.6.0-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apk/Dijla-Plus-v2.6.0-release.apk
          fi
          ls -lh dist-apk/

      - name: Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: Dijla-Plus-APK-Bundle
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 90
